<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ecomerate — Private Beta GTM</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Password-protected private beta GTM plans." />
  <style>
    :root { color-scheme: light; --bg:#f7f5f0; --paper:#fff; --ink:#1a1a1a; --muted:#5c5c5c; --line:#e6e2d8; --accent:#0b3d2e; --danger:#8b1e1e; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); }
    #gate { min-height:100vh; display:grid; place-items:center; padding:24px; }
    .card { width:min(420px,100%); background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:28px 24px; box-shadow:0 8px 30px rgba(0,0,0,.04); }
    h1 { margin:0 0 6px; font-size:1.25rem; color:var(--accent); }
    p { margin:0 0 18px; color:var(--muted); font-size:.95rem; line-height:1.45; }
    label { display:block; font-size:.8rem; font-weight:600; margin-bottom:6px; }
    input[type=password] { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font-size:1rem; background:#faf9f6; }
    button { margin-top:14px; width:100%; padding:12px 14px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; font-size:1rem; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    .err { color:var(--danger); font-size:.85rem; margin-top:10px; min-height:1.2em; }
    #unlocked { display:none; }
    #unlocked.show { display:block; }
    #gate.hide { display:none; }
  </style>
</head>
<body>
  <div id="gate">
    <form class="card" id="unlockForm" autocomplete="off">
      <h1>Ecomerate GTM</h1>
      <p>Private beta plans. Enter the shared password to unlock.</p>
      <label for="pw">Password</label>
      <input id="pw" type="password" name="password" required autofocus />
      <button type="submit" id="go">Unlock</button>
      <div class="err" id="err" aria-live="polite"></div>
    </form>
  </div>
  <div id="unlocked"></div>
  <script>
(function () {
  const EXPECTED = "1f1b717d2ba02d3e44f285b3a73cc3e40c10460eaeddd9f42cf3dff532130d30";
  const PAYLOAD_URL = "https://ecomerate-gtm.web.app/payload.json";

  async function sha256Hex(text) {
    const data = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest("SHA-256", data);
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function deriveKey(password, salt, iterations) {
    const base = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
      base,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
  }

  async function unlock(password) {
    const hash = await sha256Hex(password);
    if (hash !== EXPECTED) throw new Error("Wrong password.");

    const res = await fetch(PAYLOAD_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("Could not load secure payload.");
    const pack = await res.json();
    if (pack.pwHash && pack.pwHash !== hash) throw new Error("Wrong password.");

    const salt = b64ToBytes(pack.salt);
    const iv = b64ToBytes(pack.iv);
    const ct = b64ToBytes(pack.ct);
    const key = await deriveKey(password, salt, pack.iter || 200000);
    let plainBuf;
    try {
      plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
    } catch (e) {
      throw new Error("Wrong password.");
    }
    const data = JSON.parse(new TextDecoder().decode(plainBuf));
    const style = document.createElement("style");
    style.textContent = data.styles || "";
    document.head.appendChild(style);
    const unlocked = document.getElementById("unlocked");
    unlocked.innerHTML = data.body || "";
    unlocked.classList.add("show");
    document.getElementById("gate").classList.add("hide");
    try { sessionStorage.setItem("ecomerate_gtm_ok", "1"); } catch (_) {}
  }

  const form = document.getElementById("unlockForm");
  const err = document.getElementById("err");
  const go = document.getElementById("go");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    go.disabled = true;
    try {
      await unlock(document.getElementById("pw").value);
    } catch (ex) {
      err.textContent = ex.message || "Unlock failed.";
      go.disabled = false;
    }
  });
})();
  </script>
</body>
</html>
