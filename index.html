<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction | ziadlive</title>
    
    <!-- Your requested favicon -->
    <link rel="icon" type="image/png" href="alconet.png">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            margin-top: 0;
            color: #2c3e50;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #555;
        }

        .social-links {
            margin-top: 30px;
            padding-top: 20px;

        }

        /* Styling for the Mastodon link */
        a {
            display: inline-block;
            background-color: #563acc; /* Mastodon brand color */
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        a:hover {
            background-color: #452b99;
